type: choice
is_multiple_choice: false
options:
  - text: HOLDING — the piece is detected
    is_correct: true
  - text: IDLE — the driver released the button
    is_correct: false
  - text: "HOLDING, then IDLE, both in one tick"
    is_correct: false
  - text: Neither — two true conditions is an error
    is_correct: false
message_correct: "Right — the when expression assigns exactly one next state per tick,\
  \ and you encode priority by ordering the rows: the first matching condition wins."
message_incorrect: "Re-read the note under the transition tables in tasks 1 and 2:\
  \ when a state has more than one row and several conditions are true on the same\
  \ tick, what decides which one applies?"
custom_name: "Check: Transition Priority"
local_check: true

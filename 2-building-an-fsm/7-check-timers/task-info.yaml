type: choice
is_multiple_choice: false
options:
  - text: "It ends after one tick; the clock still holds the time from the first eject"
    is_correct: true
  - text: "It runs the full 0.5 seconds; start() zeros the clock like restart() does"
    is_correct: false
  - text: "It never ends; a timer that already ran cannot be started a second time"
    is_correct: false
  - text: "It runs for 2.5 seconds; the timer must count back down from the idle time"
    is_correct: false
message_correct: "Exactly — start() only sets the timer running. The clock kept counting\
  \ through IDLE, so hasElapsed(0.5) is already true on the next tick. restart() is\
  \ reset() then start(), which is why the entry effect must use it."
message_incorrect: "Re-read the Timer API table in task 5: which call zeros the clock,\
  \ and which one only sets it running? Then ask what the clock reads two seconds\
  \ after the first eject finished."
custom_name: "Check: Timers"
local_check: true

message_correct: "Closed-loop requests like VelocityVoltage and PositionVoltage are\
  \ what engage the configured gains, and slot 0 is the default slot — open-loop requests\
  \ ignore the gains entirely."
message_incorrect: "Look back at how task 4 contrasts open-loop and closed-loop control:\
  \ which kind of request hands the motor a target to chase, instead of an output\
  \ to produce?"

type: choice
is_multiple_choice: false
options:
  - text: VoltageOut(6.0) — the configured gains scale whatever voltage you send.
    is_correct: false
  - text: DutyCycleOut(0.5) — the gains convert the duty-cycle fraction into a velocity
      target.
    is_correct: false
  - text: VelocityVoltage(50.0) — the controller uses the Slot0 gains to chase the target
      velocity.
    is_correct: true
  - text: "Any of them — once applied, the gains automatically shape every request the\
    \ motor receives."

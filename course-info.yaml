type: marketplace
title: Kotlin FSMs for FRC Subsystems
language: English
summary: |-
  Learn to write finite state machines for FRC robotic subsystems in Kotlin.
  Designed for FRC students new to Kotlin, using lightweight stubs that mimic
  WPILib 2026 and Phoenix6 (TalonFX, CANrange) so what you learn transfers
  directly to a real robot project.

  Lessons:
    1. Kotlin from zero — values, functions, decisions, objects, lists,
       enums, when expressions, and sealed classes.
    2. Building an FSM — the two-method (stateActions / stateTransitions) pattern.
    3. Applied subsystems — Intake, Elevator, Shooter.
    4. Testing — verify FSMs without hardware.
    5. Motor configuration — TalonFX setup: neutral mode, inversion,
       current limits, and PID slots.
    6. Swerve Requests - Learn to use CTREs Swerve API
    7. Superstructure Coordination - Combine multiple subsystem state machines into a full robot.
    8. Field awareness - Learn about how robots interact with position systems

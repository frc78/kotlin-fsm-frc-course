type: choice
is_multiple_choice: false
options:
  - text: "The order doesn't matter — each periodic() call is atomic, so the flag reads\
    \ consistently wherever the assignment goes"
    is_correct: false
  - text: "So the superstructure consumes the gripper state computed this tick — anywhere\
    \ else and it reacts a full loop late, on stale data"
    is_correct: true
  - text: "The assignment must actually run first, before any subsystem updates, so\
    \ the flag starts each loop reset"
    is_correct: false
  - text: Kotlin requires an object's properties to be assigned before its functions
      can be called inside the same method
    is_correct: false
message_correct: "Exactly — a consumer must update after its producer: the gripper\
  \ sees its beam breaks in step 2, so step 3 hands the fresh value to the superstructure\
  \ for step 4, same tick."
message_incorrect: "Trace one coral through the five steps of task 8's periodic()\
  \ by hand: when does the gripper's state change, and which value of coralInGripper\
  \ does the superstructure act on?"
custom_name: "Check: Wiring Order"
local_check: true
